apiVersion: batch/v1
kind: Job
metadata:
  name: big-request
  namespace: hw5-quota
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: work
          image: skills:1.0
          imagePullPolicy: IfNotPresent
          command: ["sleep", "10"]
          resources:
            requests:
              cpu: "2"
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 128Mi
