apiVersion: v1
kind: Namespace
metadata:
  name: hw5-quota
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hw5-quota
  namespace: hw5-quota
spec:
  hard:
    pods: "3"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: hw5-quota
stringData:
  access-key: rustfsadmin
  secret-key: rustfsadmin
