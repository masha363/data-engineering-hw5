apiVersion: batch/v1
kind: Job
metadata:
  name: cpu-low
  namespace: hw5
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        exp: scheduling
    spec:
      restartPolicy: Never
      priorityClassName: hw5-low
      terminationGracePeriodSeconds: 1
      containers:
        - name: work
          image: skills:1.0
          imagePullPolicy: IfNotPresent
          command: ["sleep", "900"]
          resources:
            requests:
              cpu: 6300m
              memory: 32Mi
            limits:
              memory: 64Mi
