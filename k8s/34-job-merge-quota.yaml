apiVersion: batch/v1
kind: Job
metadata:
  name: skills-merge-quota
  namespace: hw5-quota
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: merge
          image: skills:1.0
          imagePullPolicy: IfNotPresent
          args: ["python", "skills.py", "merge"]
          env:
            - name: RUN
              value: k8s-quota
            - name: S3_ENDPOINT
              value: http://rustfs.hw5.svc.cluster.local:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
          resources:
            requests:
              cpu: 400m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
